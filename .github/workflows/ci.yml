name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Strict type checks
        run: uv run --locked mypy
      - name: Tests
        run: uv run --locked pytest
      - name: Build distribution
        run: uv build --no-sources
      - name: Verify the installed wheel outside the checkout
        run: |
          uv venv --python 3.12.13 "$RUNNER_TEMP/rent-navigator-wheel"
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/rent-navigator-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/rent-navigator-wheel/bin/python" \
            --require-hashes --requirement "$RUNNER_TEMP/rent-navigator-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/rent-navigator-wheel/bin/python" \
            --no-deps dist/*.whl
          cd /tmp
          "$RUNNER_TEMP/rent-navigator-wheel/bin/python" \
            "$GITHUB_WORKSPACE/tests/smoke_corpus.py" --checkout-root "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/rent-navigator-wheel/bin/python" -m rent_navigator.eval validate-gold \
            --data-dir "$GITHUB_WORKSPACE/eval"

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Build the committed source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git archive --format=tar HEAD | docker build \
            --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
            --tag rent-navigator:ci -
      - name: Smoke test the image revision
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:18000:8000 rent-navigator:ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/healthz > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(Path("/tmp/health.json").read_text())
          expected = {"status": "ok", "source_commit": os.environ["SOURCE_COMMIT"]}
          assert actual == expected, (actual, expected)
          print(actual)
          PY
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' rent-navigator:ci)" = "$SOURCE_COMMIT"
      - name: Verify packaged corpus offline as the container user
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --workdir /tmp \
            --volume "$GITHUB_WORKSPACE/tests/smoke_corpus.py:/tmp/smoke_corpus.py:ro" \
            rent-navigator:ci python /tmp/smoke_corpus.py --checkout-root /app
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --workdir /tmp --volume "$GITHUB_WORKSPACE/eval:/tmp/eval:ro" \
            rent-navigator:ci python -m rent_navigator.eval validate-gold --data-dir /tmp/eval

  offline-eval-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      manifest-sha256: ${{ steps.identity.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - name: Execute the existing security boundary suite
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          uv run --locked pytest tests/test_security_pipeline.py \
            --junitxml="$RUNNER_TEMP/security.xml"
      - name: Run approved exact cases and deterministic retrieval
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run --locked python -m rent_navigator.eval offline \
            --data-dir eval --output-dir "$RUNNER_TEMP/offline-artifacts" \
            --source-sha "$SOURCE_COMMIT" --base-sha "$BASE_SHA" \
            --security-report "$RUNNER_TEMP/security.xml" --lockfile uv.lock
      - name: Record producer manifest identity
        id: identity
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/offline-artifacts/manifest.json"; then
            digest=$(sha256sum "$RUNNER_TEMP/offline-artifacts/manifest.json" | cut -d ' ' -f 1)
            printf 'manifest-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve complete or failed offline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-artifacts/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  offline-eval:
    if: always()
    needs: [checks, docker, offline-eval-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every prerequisite to succeed
        env:
          PREREQUISITES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          prerequisites = json.loads(os.environ["PREREQUISITES"])
          expected = {"checks", "docker", "offline-eval-run"}
          if set(prerequisites) != expected or any(job["result"] != "success" for job in prerequisites.values()):
              raise SystemExit("Offline acceptance requires every prerequisite to succeed.")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offline-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-artifacts
          digest-mismatch: error
      - name: Verify source, approval, evidence and exact artifact contents
        env:
          MANIFEST_SHA256: ${{ needs.offline-eval-run.outputs.manifest-sha256 }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          OFFLINE_RESULT: ${{ needs.offline-eval-run.result }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          prerequisites=$(python3 -c 'import json, os; print(json.dumps({"checks": os.environ["CHECKS_RESULT"], "docker": os.environ["DOCKER_RESULT"], "offline-eval-run": os.environ["OFFLINE_RESULT"]}))')
          uv run --locked python -m rent_navigator.eval verify-offline \
            --data-dir eval --output-dir "$RUNNER_TEMP/offline-artifacts" \
            --source-sha "$SOURCE_COMMIT" --base-sha "$BASE_SHA" \
            --manifest-sha256 "$MANIFEST_SHA256" --prerequisites "$prerequisites" \
            --lockfile uv.lock

  live-eval-plan:
    needs: [checks, docker, offline-eval]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - name: Select verified reuse or a protected funded execution
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: uv run --locked python scripts/live_ci.py plan

  live-eval-execute:
    if: needs.live-eval-plan.outputs.mode == 'execute'
    needs: [checks, docker, offline-eval, offline-eval-run, live-eval-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: live-eval
    concurrency:
      group: rent-navigator-paid-live-eval
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      manifest-sha256: ${{ steps.identity.outputs.manifest-sha256 }}
      batch-uuid: ${{ steps.permit.outputs.batch-uuid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offline-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-artifacts
          digest-mismatch: error
      - name: Validate protected environment, exact-run permit and required secret
        id: permit
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_EVAL_PERMIT: ${{ secrets.LIVE_EVAL_PERMIT }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          uv run --locked python scripts/live_ci.py permit \
            --permit-file "$RUNNER_TEMP/live-permit.json"
      - name: Execute the single permitted complete live batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OFFLINE_MANIFEST_SHA256: ${{ needs.offline-eval-run.outputs.manifest-sha256 }}
          OFFLINE_PREREQUISITES: '{"checks":"${{ needs.checks.result }}","docker":"${{ needs.docker.result }}","offline-eval-run":"${{ needs.offline-eval-run.result }}"}'
        run: |
          uv run --locked python -m rent_navigator.eval live-gate \
            --data-dir eval --output-dir "$RUNNER_TEMP/live-artifacts" \
            --source-sha "$SOURCE_COMMIT" --offline-dir "$RUNNER_TEMP/offline-artifacts" \
            --permit-file "$RUNNER_TEMP/live-permit.json" \
            --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/ci.yml \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --lockfile uv.lock
      - name: Bind the producer manifest to this successful or failed job
        id: identity
        if: always() && steps.permit.outcome == 'success'
        run: |
          uv run --locked python scripts/live_ci.py identity \
            --output-dir "$RUNNER_TEMP/live-artifacts"
      - name: Preserve complete or partial paid evidence without replacement
        if: always() && steps.permit.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-${{ env.SOURCE_COMMIT }}-${{ steps.permit.outputs.batch-uuid }}
          path: ${{ runner.temp }}/live-artifacts/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  live-eval-reuse:
    if: needs.live-eval-plan.outputs.mode == 'reuse'
    needs: [checks, docker, offline-eval, live-eval-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - name: Download and independently verify retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          uv run --locked python scripts/live_ci.py reuse \
            --output-dir "$RUNNER_TEMP/reused-live-artifacts"

  live-eval-gate:
    if: always()
    needs: [checks, docker, offline-eval, live-eval-plan, live-eval-execute, live-eval-reuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - name: Require current checks and verify the selected complete evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PREREQUISITES: ${{ toJSON(needs) }}
          SELECTED_PLAN: ${{ needs.live-eval-plan.outputs.plan }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          uv run --locked python scripts/live_ci.py summary \
            --output-dir "$RUNNER_TEMP/verified-live-artifacts"
