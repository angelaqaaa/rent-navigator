[project]
name = "rent-navigator"
version = "0.1.0"
description = "Ontario renter-rights information service"
readme = "README.md"
license-files = ["NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==1.7.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pypdf==6.19.0",
    "pyyaml==6.0.3",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["uv_build==0.11.21"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
